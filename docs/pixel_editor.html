<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Slicer — Pixel Art Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#ddd;font-family:monospace;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;user-select:none}
h1{font-size:13px;color:#888;letter-spacing:.08em}

/* ── toolbar rows ── */
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#222;color:#ccc;border:1px solid #3a3a3a;border-radius:3px;padding:3px 9px;cursor:pointer;font-family:monospace;font-size:12px;white-space:nowrap}
button:hover{background:#2e2e2e}
button.active{background:#3a3a3a;border-color:#777;color:#fff}

/* ── paint swatches ── */
.swatch{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:2px solid #333;border-radius:3px;cursor:pointer;font-size:12px}
.swatch:hover{border-color:#666}
.swatch.active{border-color:#ccc}
.dot{width:11px;height:11px;border-radius:2px;flex-shrink:0}

/* ── canvas area ── */
#wrap{position:relative;line-height:0;cursor:crosshair}
#bg-canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#art-canvas{position:absolute;top:0;left:0;pointer-events:none}
#hover-canvas{position:absolute;top:0;left:0;pointer-events:none}

/* ── misc ── */
label.lbl{font-size:11px;color:#777}
#status{font-size:11px;color:#666;min-height:13px;text-align:center}
#export-btn{background:#1e3a1e;border-color:#3a6a3a}
#export-btn:hover{background:#274527}
#frame-info{font-size:12px;color:#999;min-width:90px;text-align:center}
input[type=range]{cursor:pointer}
</style>
</head>
<body>
<h1>CELL SLICER — PIXEL ART EDITOR</h1>

<!-- row 1: playback -->
<div class="row">
  <button id="play-btn">▶ Play</button>
  <input type="range" id="scrub" min="0" value="0" style="width:280px">
  <span id="frame-info">frame 0 / 0</span>
  <button id="slow-btn">½×</button>
  <button id="norm-btn" class="active">1×</button>
  <button id="fast-btn">2×</button>
</div>

<!-- row 2: display -->
<div class="row">
  <label class="lbl">Overlay α:</label>
  <input type="range" id="alpha-sl" min="0" max="100" value="80" style="width:80px">
  <label class="lbl" style="margin-left:6px">Zoom:</label>
  <button id="z6-btn">6×</button>
  <button id="z8-btn">8×</button>
  <button id="z10-btn" class="active">10×</button>
  <button id="z12-btn">12×</button>
</div>

<!-- row 3: paint tools -->
<div class="row">
  <label class="lbl">Paint:</label>
  <span class="swatch active" data-label="0"><span class="dot" style="background:#111;border:1px solid #555"></span>Erase</span>
  <span class="swatch" data-label="1"><span class="dot" style="background:#cc2222"></span>RBC fill</span>
  <span class="swatch" data-label="2"><span class="dot" style="background:#882299"></span>RBC edge</span>
  <span class="swatch" data-label="3"><span class="dot" style="background:#22cc44"></span>Neutrophil</span>
  <span class="swatch" data-label="stamp" id="stamp-swatch"><span class="dot" style="background:radial-gradient(circle,#cc2222 40%,#882299 100%)"></span>Stamp RBC</span>
  <button id="undo-btn">↩ Undo</button>
  <button id="export-btn">⬇ Export</button>
</div>

<!-- canvas -->
<div id="wrap">
  <canvas id="bg-canvas"></canvas>
  <canvas id="art-canvas"></canvas>
  <canvas id="hover-canvas"></canvas>
</div>

<div id="status">Loading…</div>
<div class="row" style="font-size:10px;color:#555">
  ← → navigate &nbsp;|&nbsp; 0–3 paint &nbsp;|&nbsp; S stamp RBC &nbsp;|&nbsp; Ctrl+Z undo &nbsp;|&nbsp; click+drag to paint
</div>

<script>
// ── Palette (label → [r,g,b,a]) ───────────────────────────────────────────
const PAL = {
  0: null,
  1: [204,  34,  34, 210],
  2: [136,  34, 153, 240],
  3: [ 34, 204,  68, 220],
};

// ── State ─────────────────────────────────────────────────────────────────
let data = null;
let origFrames = null;   // ImageData per art-frame
let edited = null;       // Int8Array per art-frame (-1 = unedited)
let fi = 0;
let playing = false, timer = null, speed = 1;
let zoom = 10;
let alpha = 0.80;
let paintLabel = 0;   // 0-3 or 'stamp'
let painting = false;
let undo = [];

const bgC  = document.getElementById('bg-canvas');
const artC = document.getElementById('art-canvas');
const hovC = document.getElementById('hover-canvas');
const bgX  = bgC.getContext('2d');
const artX = artC.getContext('2d');
const hovX = hovC.getContext('2d');
const scrub  = document.getElementById('scrub');
const finfo  = document.getElementById('frame-info');
const status = document.getElementById('status');
const playBtn= document.getElementById('play-btn');

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  status.textContent = 'Loading pixel_art.json…';
  try {
    data = await fetch('pixel_art.json').then(r => r.json());
  } catch(e) { status.textContent = 'Error: ' + e; return; }

  scrub.max = data.n_frames - 1;
  edited = Array.from({length: data.n_frames}, () =>
    new Int8Array(data.width * data.height).fill(-1));

  setZoom(zoom);
  status.textContent = 'Decoding video…';
  await decodeFrames();
  showFrame(0);
  status.textContent = 'Ready. Keys: ← → navigate | 0-3 paint | S stamp | Ctrl+Z undo';
}

// ── Decode original frames via video seek ─────────────────────────────────
async function decodeFrames() {
  const vid = document.createElement('video');
  vid.src = 'chase-original.mp4';
  vid.muted = true;
  vid.preload = 'auto';
  await new Promise(r => { vid.oncanplay = r; vid.load(); });

  const W = data.width * data.block_size;
  const H = data.height * data.block_size;
  const ofc = Object.assign(document.createElement('canvas'), {width: W, height: H});
  const ox  = ofc.getContext('2d');
  const fps = data.fps || 15;
  const dur = vid.duration;
  const src = data.src_indices;

  origFrames = new Array(data.n_frames);
  for (let ai = 0; ai < data.n_frames; ai++) {
    const t = src[ai] / fps;
    if (t > dur) { origFrames[ai] = origFrames[ai-1]; continue; }
    await new Promise(r => { vid.onseeked = r; vid.currentTime = t; });
    ox.drawImage(vid, 0, 0, 320, 240, 0, 0, W, H);
    origFrames[ai] = ox.getImageData(0, 0, W, H);
    if (ai % 30 === 0) status.textContent = `Decoding… ${ai}/${data.n_frames}`;
  }
  status.textContent = 'Frames decoded.';
}

// ── Layout ────────────────────────────────────────────────────────────────
function setZoom(z) {
  zoom = z;
  const pw = data.width  * z, ph = data.height * z;
  [bgC, artC, hovC].forEach(c => {
    c.width = pw; c.height = ph;
    c.getContext('2d').imageSmoothingEnabled = false;
  });
  document.querySelectorAll('[id^=z]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('z'+z+'-btn');
  if (btn) btn.classList.add('active');
}

// ── Render ────────────────────────────────────────────────────────────────
function showFrame(idx) {
  fi = Math.max(0, Math.min(data.n_frames - 1, idx));
  scrub.value = fi;
  finfo.textContent = `frame ${fi} / ${data.n_frames-1}`;

  // Background
  if (origFrames?.[fi]) {
    const tmp = Object.assign(document.createElement('canvas'),
      {width: data.width*data.block_size, height: data.height*data.block_size});
    tmp.getContext('2d').putImageData(origFrames[fi], 0, 0);
    bgX.drawImage(tmp, 0, 0, bgC.width, bgC.height);
  } else {
    bgX.fillStyle='#000'; bgX.fillRect(0,0,bgC.width,bgC.height);
  }

  renderArt();
}

function getLabel(idx) {
  const e = edited[fi][idx]; return e >= 0 ? e : data.frames[fi][idx];
}

function renderArt() {
  const W = data.width, H = data.height;
  const img = artX.createImageData(W*zoom, H*zoom);
  const d = img.data;
  for (let ay = 0; ay < H; ay++) {
    for (let ax = 0; ax < W; ax++) {
      const col = PAL[getLabel(ay*W+ax)];
      if (!col) continue;
      const [r,g,b,a] = col;
      const fa = Math.round(a * alpha);
      for (let dy = 0; dy < zoom; dy++) for (let dx = 0; dx < zoom; dx++) {
        const p = ((ay*zoom+dy)*W*zoom + (ax*zoom+dx))*4;
        d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=fa;
      }
    }
  }
  artX.putImageData(img, 0, 0);
}

// ── Hover preview (stamp) ─────────────────────────────────────────────────
function clearHover() { hovX.clearRect(0,0,hovC.width,hovC.height); }

function drawHover(ax, ay) {
  clearHover();
  if (paintLabel !== 'stamp') return;
  const r = data.rbc_radius || 3;
  hovX.save();
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx*dx+dy*dy > r*r) continue;
    const nx = ax+dx, ny = ay+dy;
    if (nx < 0 || nx >= data.width || ny < 0 || ny >= data.height) continue;
    const isEdge = (() => {
      // edge if any neighbour is outside disc
      for (let ey=-1;ey<=1;ey++) for (let ex=-1;ex<=1;ex++) {
        if ((dx+ex)**2+(dy+ey)**2 > r*r) return true;
      }
      return false;
    })();
    hovX.fillStyle = isEdge ? 'rgba(136,34,153,0.75)' : 'rgba(204,34,34,0.60)';
    hovX.fillRect(nx*zoom, ny*zoom, zoom, zoom);
  }
  hovX.restore();
}

// ── Paint ─────────────────────────────────────────────────────────────────
function pointerToArt(clientX, clientY) {
  const r = hovC.getBoundingClientRect();
  return {
    ax: Math.floor((clientX - r.left)  / zoom),
    ay: Math.floor((clientY - r.top)   / zoom)
  };
}

function applyPaint(ax, ay) {
  const W = data.width;
  if (paintLabel === 'stamp') {
    const r = data.rbc_radius || 3;
    const batch = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx*dx+dy*dy > r*r) continue;
      const nx = ax+dx, ny = ay+dy;
      if (nx<0||nx>=data.width||ny<0||ny>=data.height) continue;
      const idx = ny*W+nx;
      const isEdge = (() => {
        for (let ey=-1;ey<=1;ey++) for (let ex=-1;ex<=1;ex++) {
          if ((dx+ex)**2+(dy+ey)**2>r*r) return true;
        }
        return false;
      })();
      const newLabel = isEdge ? 2 : 1;
      if (edited[fi][idx] === newLabel) continue;
      batch.push({idx, old: edited[fi][idx]});
      edited[fi][idx] = newLabel;
    }
    if (batch.length) undo.push({frame:fi, batch});
  } else {
    const idx = ay*W+ax;
    if (ax<0||ax>=data.width||ay<0||ay>=data.height) return;
    const old = edited[fi][idx];
    if (old === paintLabel) return;
    undo.push({frame:fi, batch:[{idx, old}]});
    edited[fi][idx] = paintLabel;
  }
  renderArt();
}

// Pointer event wiring (both mouse and touch)
function onDown(e) {
  e.preventDefault();
  painting = true;
  const pt = e.touches ? e.touches[0] : e;
  const {ax,ay} = pointerToArt(pt.clientX, pt.clientY);
  applyPaint(ax, ay);
}
function onMove(e) {
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const {ax,ay} = pointerToArt(pt.clientX, pt.clientY);
  drawHover(ax, ay);
  if (painting) applyPaint(ax, ay);
}
function onUp() { painting = false; }

// Attach to the hover canvas (topmost)
hovC.addEventListener('mousedown', onDown);
hovC.addEventListener('mousemove', onMove);
window.addEventListener('mouseup',  onUp);
hovC.addEventListener('touchstart', onDown, {passive:false});
hovC.addEventListener('touchmove',  onMove, {passive:false});
window.addEventListener('touchend', onUp);
hovC.addEventListener('mouseleave', clearHover);
hovC.style.cursor = 'crosshair';
hovC.style.pointerEvents = 'auto';
artC.style.pointerEvents = 'none';

// ── Playback ──────────────────────────────────────────────────────────────
function play() {
  if (playing) return;
  playing = true; playBtn.textContent = '⏸ Pause';
  timer = setInterval(() => showFrame((fi+1) % data.n_frames), 1000/(15*speed));
}
function pause() {
  playing = false; playBtn.textContent = '▶ Play';
  clearInterval(timer);
}
playBtn.addEventListener('click', () => playing ? pause() : play());
scrub.addEventListener('input', () => { pause(); showFrame(+scrub.value); });

function setSpeed(s) {
  speed = s;
  ['slow','norm','fast'].forEach(k => document.getElementById(k+'-btn').classList.remove('active'));
  ({0.5:'slow',1:'norm',2:'fast'})[s];
  document.getElementById({0.5:'slow',1:'norm',2:'fast'}[s]+'-btn').classList.add('active');
  if (playing) { pause(); play(); }
}
document.getElementById('slow-btn').addEventListener('click', () => setSpeed(0.5));
document.getElementById('norm-btn').addEventListener('click', () => setSpeed(1));
document.getElementById('fast-btn').addEventListener('click', () => setSpeed(2));

document.getElementById('alpha-sl').addEventListener('input', e => {
  alpha = e.target.value/100; renderArt();
});

[6,8,10,12].forEach(z =>
  document.getElementById('z'+z+'-btn').addEventListener('click', () => {
    setZoom(z); showFrame(fi);
  }));

// ── Tool selection ────────────────────────────────────────────────────────
function selectTool(lbl) {
  paintLabel = lbl;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  const sw = typeof lbl === 'number'
    ? document.querySelector(`.swatch[data-label="${lbl}"]`)
    : document.getElementById('stamp-swatch');
  if (sw) sw.classList.add('active');
  if (lbl !== 'stamp') clearHover();
}
document.querySelectorAll('.swatch').forEach(s =>
  s.addEventListener('click', () =>
    selectTool(s.dataset.label === 'stamp' ? 'stamp' : +s.dataset.label)));

// ── Undo ──────────────────────────────────────────────────────────────────
document.getElementById('undo-btn').addEventListener('click', () => {
  if (!undo.length) return;
  const {frame, batch} = undo.pop();
  batch.forEach(({idx, old}) => edited[frame][idx] = old);
  if (frame === fi) renderArt();
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey||e.metaKey) && e.key==='z') {
    e.preventDefault(); document.getElementById('undo-btn').click(); return;
  }
  const map = {
    'ArrowRight': () => { pause(); showFrame(fi+1); },
    'ArrowLeft':  () => { pause(); showFrame(fi-1); },
    '0': () => selectTool(0),
    '1': () => selectTool(1),
    '2': () => selectTool(2),
    '3': () => selectTool(3),
    's': () => selectTool('stamp'),
    'S': () => selectTool('stamp'),
    ' ': () => { e.preventDefault(); playing ? pause() : play(); },
  };
  if (map[e.key]) map[e.key]();
});

// ── Export ────────────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const merged = data.frames.map((f, i) => {
    const e = edited[i];
    return f.map((v, j) => e[j] >= 0 ? e[j] : v);
  });
  const out = {...data, frames: merged, edited: true,
               exported_at: new Date().toISOString()};
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})),
    download: 'pixel_art_edited.json'
  });
  a.click();
  status.textContent = 'Exported pixel_art_edited.json ✓';
});

init();
</script>
</body>
</html>
